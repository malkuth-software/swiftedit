# The template_harness commit SwiftEdit builds with. It must equal the
# GUI.Forms pin's gui_forms/harness.lock: GUI.Forms' tools forward to the
# harness checked out beside it (template_harness/ at this root), and
# tools/prepare_dependencies.py refuses a mismatch.
[harness]
repository = "malkuth-software/template_harness"
commit = "523c2a7a7f36d1ae06e82fa031f56599e25d3e18"
