name: Build cross-platform SwiftEdit
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md']
  # Every pull request runs, so "SwiftEdit checks" always reports for branch protection.
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested installers from master
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to a pull request cancels its older run. Master pushes are
# never cancelled: each run completes, and a merge landing meanwhile waits
# (GitHub keeps only the newest waiting run), so the release run of the
# current master always finishes. Publish-Release.py publishes only when its
# revision is still master's head.
concurrency:
  group: native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Test publication and installer contracts
        run: python3 -B -m unittest discover -s tests -p test_publication.py
      - name: Select one tested publication version
        id: version
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: python3 -B tools/publication_version.py
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      SWIFTEDIT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      CC: clang
      CXX: clang++
      OBJCXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
      # Windows builds with GUI.Forms' published CLANG64 toolchain (LLVM
      # 22.1.8, with the same packages SwiftEdit installed before); the MSYS2
      # mirrors carry only the current LLVM. Restoring it needs Python 3.14
      # (stdlib zstd) and the pinned GUI.Forms tools, so on Windows the
      # providers are fetched first, from bash, before any msys2 step.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Fetch pinned providers and import verified GUI.Forms cache on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: |
          # The MSYS2 git that builds later must see the checkouts' LF files as clean.
          git config --global core.autocrlf false
          "$TOOLCHAIN_PYTHON" -B tools/prepare_dependencies.py --platform windows-x64 --restore-cache --fetch-only
      - name: Restore GUI.Forms' published Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        # The harness reads the toolchain from its project file's [toolchain]
        # repository: GUI.Forms' own releases.
        run: '"$TOOLCHAIN_PYTHON" gui_forms/tools/windows_toolchain.py restore'
      - name: Install macOS LLVM 22
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja ccache llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
          echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Install Linux LLVM 22 and native libraries
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 cmake ninja-build generate-ninja ccache pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libatk1.0-dev libatk-bridge2.0-dev xvfb xauth patchelf dpkg-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Test dependency cache admission
        run: python -B -m unittest discover -s tests -p test_dependency_cache.py
      - name: Fetch pinned providers and import verified GUI.Forms cache
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B tools/prepare_dependencies.py --platform ${{ matrix.platform }} --restore-cache --fetch-only
      - name: Identify the shared compiler and SDK contract
        id: compiler
        run: python -B gui_forms/tools/compiler_identity.py
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: .ccache
          key: swiftedit-llvm22-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('ci/dependencies.json', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'src/**', 'tests/**', 'tools/**', 'third_party/**', '.github/workflows/native-builds.yml') }}
          restore-keys: |
            swiftedit-llvm22-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-
            swiftedit-llvm22-v1-${{ matrix.platform }}-
      - uses: actions/cache/restore@v4
        id: renderer
        if: runner.os != 'Windows'
        with:
          path: |
            gui_forms/third_party/skia
            .build/native-${{ matrix.platform }}/skia
          key: swiftedit-skia-llvm22-v1-${{ matrix.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('ci/dependencies.json') }}
      - name: Configure compiler cache
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          export CCACHE_DIR="$cache_dir"
          ccache --max-size=900M
          ccache --zero-stats
      - name: Build public installed dependencies
        id: dependencies
        run: python -B tools/prepare_dependencies.py --platform ${{ matrix.platform }} --jobs 4
      - uses: actions/cache/save@v4
        if: runner.os != 'Windows' && steps.renderer.outputs.cache-hit != 'true'
        with:
          path: |
            gui_forms/third_party/skia
            .build/native-${{ matrix.platform }}/skia
          key: ${{ steps.renderer.outputs.cache-primary-key }}
      - name: Compile SwiftEdit
        id: compile
        run: python -B tools/Build-Native.py --platform ${{ matrix.platform }} --build-only --jobs 4
      - name: Report compiler cache statistics
        if: always()
        run: |
          ccache --show-stats --verbose
          mkdir -p .build
          ccache --print-stats > .build/compiler-cache.txt
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outcome == 'success' && steps.objects.outputs.cache-hit != 'true'
        with:
          path: .ccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Test and package Windows or macOS
        if: runner.os != 'Linux'
        run: python -B tools/Build-Native.py --platform ${{ matrix.platform }} --test-package-only --installers
      - name: Test and package Linux with an owned virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python -B tools/Build-Native.py --platform ${{ matrix.platform }} --test-package-only --installers
      - name: Upload platform dogfood download
        uses: actions/upload-artifact@v4
        with:
          name: SwiftEdit-${{ matrix.platform }}
          path: .build/native-${{ matrix.platform }}/app/dist/*
          if-no-files-found: error
          compression-level: 0
      # SwiftEdit's own code under AddressSanitizer and UndefinedBehaviorSanitizer
      # (LeakSanitizer too on Linux and macOS), headless tests only, never packaged.
      - name: Test SwiftEdit under the sanitizers
        run: python -B tools/Build-Native.py --platform ${{ matrix.platform }} --sanitize --jobs 4
      - name: Preserve native test and package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.platform }}
          path: |
            .build/compiler-cache.txt
            .build/native-${{ matrix.platform }}/app/Testing/Temporary/
            .build/native-${{ matrix.platform }}/app-sanitize/Testing/Temporary/
            .build/native-${{ matrix.platform }}/app/mac-package-*/startup.log
            .build/native-${{ matrix.platform }}/app/mac-package-*/idle-stack*.txt
            .build/native-${{ matrix.platform }}/app/native-visual-*/*.png
            .build/native-${{ matrix.platform }}/app/terminal-end-evidence/summary.txt
            .build/native-${{ matrix.platform }}/app/terminal-end-evidence/receipt.json
            .build/native-${{ matrix.platform }}/app/terminal-end-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/app/search-evidence/summary.txt
            .build/native-${{ matrix.platform }}/app/search-evidence/receipt.json
            .build/native-${{ matrix.platform }}/app/search-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/app/text-copy-evidence/summary.txt
            .build/native-${{ matrix.platform }}/app/text-copy-evidence/receipt.json
            .build/native-${{ matrix.platform }}/app/text-copy-evidence/fixtures/samples.csv
            .build/native-${{ matrix.platform }}/app/navigation-evidence/summary.txt
            .build/native-${{ matrix.platform }}/app/navigation-evidence/receipt.json
            .build/native-${{ matrix.platform }}/app/navigation-evidence/fixtures/samples.csv
          if-no-files-found: ignore

  # The one check branch protection requires: it always reports, and passes
  # only when the preparation and every native build, test and package job did.
  summary:
    name: SwiftEdit checks
    needs: [prepare, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the preparation and every native job to pass
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          echo "prepare: $PREPARE_RESULT; native: $NATIVE_RESULT"
          test "$PREPARE_RESULT" = success
          test "$NATIVE_RESULT" = success

  release:
    name: Publish validated cross-platform release
    needs: [prepare, native]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: swiftedit-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SwiftEdit-*
          path: release-assets
      - name: Publish immutable commit download set
        env:
          GH_TOKEN: ${{ github.token }}
          SWIFTEDIT_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 -B tools/Publish-Release.py --artifacts release-assets --tag "$RELEASE_TAG" --installers
